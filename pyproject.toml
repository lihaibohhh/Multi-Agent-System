[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research"
version = "0.1.0"
description = "A LangGraph-based supervisor multi-agent research system."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # API and service runtime
    "fastapi==0.128.4",
    "httpx==0.28.1",
    "uvicorn[standard]==0.52.4",

    # LangChain / LangGraph stack. Keep this version line aligned with the
    # verified dependency set used by the sibling knowledge-service project.
    "langchain==1.2.3",
    "langchain-anthropic==1.3.1",
    "langchain-core==1.2.6",
    "langchain-openai==1.1.7",
    "langchain-tavily==0.2.16",
    "langgraph==1.0.5",
    "langgraph-prebuilt==1.0.5",
    "openai==2.14.0",

    # Configuration and persistence
    "langgraph-checkpoint-postgres==3.0.5",
    "langgraph-checkpoint-sqlite==3.0.3",
    "psycopg[binary]==3.3.5",
    "psycopg-pool==3.3.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    "pyyaml==6.0.2",
    "redis==7.3.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan==2.1.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "ruff==0.8.0",
]
eval = [
    "ragas==0.4.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["multi_agent_research*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
"multi_agent_research.api" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["multi_agent_research"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".idea", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
